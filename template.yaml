AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: parking-admin-backend
  
Globals:
  Function:
    Timeout: 3
    MemorySize: 128
    Runtime: nodejs24.x

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: The environment to deploy to.
  ProjectName:
    Type: String
    Default: parking-admin-backend
    Description: The name of the project.
  ResourcesName:
    Type: String
    Default: "parking-admin"
    Description: Cognito User Pool name
  InitialAdminEmail:
    Type: String
    Default: "admin@parking.com"

Resources:
  ParkingApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt ParkingUserPool.Arn

  ParkingUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub ${ResourcesName}-userpool-${Environment}
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email

  ParkingUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${ResourcesName}-userpool-client-${Environment}
      UserPoolId: !Ref ParkingUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH

  AdminUserPoolGroup:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: "admin"
        UserPoolId: !Ref ParkingUserPool
        Description: "Administrator role with elevated permissions"
        Precedence: 1

  CustomerUserPoolGroup:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: "customer"
        UserPoolId: !Ref ParkingUserPool
        Description: "Standard customer role"
        Precedence: 10

  InitialAdminUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref ParkingUserPool
      Username: !Ref InitialAdminEmail
      UserAttributes:
        - Name: email
          Value: !Ref InitialAdminEmail
        - Name: email_verified
          Value: "true"
      #   - Name: name
      #     Value: "admin"
      # MessageAction: RESEND

  AdminUserGroupAttachment:
      Type: AWS::Cognito::UserPoolUserToGroupAttachment
      Properties:
        UserPoolId: !Ref ParkingUserPool
        Username: !Ref InitialAdminUser
        GroupName: !Ref AdminUserPoolGroup

  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello-world/
      Handler: app.lambdaHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Events:
        HelloWorld:
          Type: Api
          Properties:
            RestApiId: !Ref ParkingApi
            Path: /hello
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints: 
        - app.ts

  HelloWorldNoAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello-world-without-auth/
      Handler: app.lambdaHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Events:
        PublicHelloWorld:
          Type: Api
          Properties:
            RestApiId: !Ref ParkingApi
            Path: /hello-no-auth
            Method: get
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints: 
        - app.ts

  InsertPlateRecordFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: insert-plate-record/
      Handler: app.lambdaHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref ParkingTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ParkingTable.Arn
      Events:
        InsertPlateRecord:
          Type: Api
          Properties:
            RestApiId: !Ref ParkingApi
            Path: /insert-plate-record
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints: 
        - app.ts

  UpsertPricingRecordFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: upsert-pricing-record/
      Handler: app.lambdaHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref ParkingPricingTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ParkingPricingTable.Arn
      Events:
        UpsertPricingRecord:
          Type: Api
          Properties:
            RestApiId: !Ref ParkingApi
            Path: /upsert-pricing-record
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints: 
        - app.ts

  GetPricingRecordFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get-pricing-record/
      Handler: app.lambdaHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref ParkingPricingTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt ParkingPricingTable.Arn
      Events:
        GetPricingRecord:
          Type: Api
          Properties:
            RestApiId: !Ref ParkingApi
            Path: /get-pricing-record/{parking_id}
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints: 
        - app.ts
  
  ParkingTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${ResourcesName}-parking-${Environment}
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: parking_id
          KeyType: HASH
        - AttributeName: plate_number
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: parking_id
          AttributeType: S
        - AttributeName: plate_number
          AttributeType: S
      GlobalSecondaryIndexes:
        - IndexName: plate_number_index
          KeySchema:
            - AttributeName: plate_number
              KeyType: HASH
          Projection:
            ProjectionType: ALL
            
  ParkingPricingTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${ResourcesName}-pricing-${Environment}
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: parking_id
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: parking_id
          AttributeType: S

Outputs:
  Api:
    Description: "API Gateway endpoint URL for Prod stage for Hello World function"
    Value: !Sub "https://${ParkingApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  Environment:
    Description: "Environment name"
    Value: !Ref Environment
  ClientId:
    Description: "Cognito User Pool Client ID"
    Value: !Ref ParkingUserPoolClient
  HelloWorldFunctionIamRole:
    Description: "Implicit IAM Role created for Hello World function"
    Value: !GetAtt HelloWorldFunctionRole.Arn
